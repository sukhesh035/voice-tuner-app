name: Deploy Admin-API

on:
  push:
    branches: [dev]
    paths:
      - 'apps/admin-api/**'
      - 'apps/infra/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-admin-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Admin-API
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read

    env:
      AWS_REGION: us-east-1
      STAGE:      dev

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # ── 2. Node + pnpm ───────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 22
          cache: pnpm

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. AWS credentials ───────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.3
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 5. Build admin-api Lambda bundle ─────────────────────────────────────
      #   `cdk deploy` uploads the bundled handler itself, so no separate
      #   aws lambda update-function-code step is needed (unlike the legacy
      #   backend-api workflow which deploys to pre-existing functions).
      - name: Build admin-api bundle
        run: pnpm build:admin-api

      # ── 6. Write Cognito pool/client IDs to SSM (idempotent prereq) ─────────
      #   AdminApiStack resolves the Cognito pool/client IDs from SSM params
      #   that SwaraStack normally publishes. SwaraStack can't be deployed here —
      #   its Lambdas bind to dist/apps/backend-api, which this workflow never
      #   builds — so write the two params directly instead.
      - name: Write Cognito IDs to SSM
        run: |
          aws ssm put-parameter \
            --name "/swara-dev/cognito/user-pool-id" \
            --value "${{ secrets.SWARA_USER_POOL_ID }}" \
            --type String \
            --overwrite
          aws ssm put-parameter \
            --name "/swara-dev/cognito/user-pool-client-id" \
            --value "${{ secrets.SWARA_CLIENT_ID }}" \
            --type String \
            --overwrite

      # ── 7. Deploy AdminApiStack (new CDK stack, deployed fresh each time) ───
      #   DEPLOY_ADMIN_API_DEV skips SwaraStackDev so `cdk deploy` only
      #   synthesizes AdminApiStackDev — otherwise whole-app synth would try to
      #   resolve SwaraStackDev's dist/apps/backend-api asset, which this
      #   workflow never builds.
      - name: Deploy AdminApiStack
        working-directory: apps/infra
        run: npx cdk deploy AdminApiStackDev --require-approval never --ci
        env:
          DEPLOY_ADMIN_API_DEV: "1"
